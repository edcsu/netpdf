name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
            11.0.x
      - name: Install fonts (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-liberation fonts-dejavu-core
      - name: Build
        run: dotnet build -c Release
      - name: Test
        run: dotnet test -c Release --no-build

  publish:
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
            11.0.x
      - name: Pack
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for p in NetPdf NetPdf.Svg NetPdf.Barcodes NetPdf.Rendering NetPdf.Bundle; do
            dotnet pack src/$p -c Release -p:Version="$VERSION" -o out
          done
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: edcsu
      # Core first, then the add-ons, then the meta-package that depends on them all.
      - name: Push NetPdfKit.Core
        run: >
          dotnet nuget push "out/NetPdfKit.Core.*.nupkg"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
      - name: Push NetPdfKit add-ons (Svg, Barcodes, Rendering)
        run: |
          # dotnet nuget push only understands * and ?, so let bash expand the pattern.
          for f in out/NetPdfKit.[SBR]*.nupkg; do
            dotnet nuget push "$f" \
              --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
      - name: Push NetPdfKit (meta-package)
        run: |
          # dotnet nuget push only understands * and ?, so let bash expand the pattern.
          for f in out/NetPdfKit.[0-9]*.nupkg; do
            dotnet nuget push "$f" \
              --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
